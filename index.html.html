<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#050505">
<title>VARVEO — Opening Soon</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%}
body{min-height:100svh;display:grid;place-items:center;background:#050505;color:#f5f5f5;font-family:Arial,Helvetica,sans-serif;overflow:hidden}
main{width:min(920px,92vw);min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:5vh 0 4vh}
.logo{width:min(250px,48vw);height:auto;margin-bottom:clamp(38px,7vh,70px);display:block}
h1{margin:0;font-size:clamp(2.4rem,7vw,5.2rem);font-weight:300;letter-spacing:.28em;line-height:1;padding-left:.28em}
.subtitle{margin-top:24px;font-size:clamp(.72rem,1.6vw,1rem);letter-spacing:.34em;font-weight:400;padding-left:.34em}
.line{width:82px;height:2px;background:#f5f5f5;margin:42px 0 34px}
.tagline{font-size:clamp(.7rem,1.5vw,.94rem);letter-spacing:.38em;padding-left:.38em}
.statement{margin-top:68px;font-size:clamp(.62rem,1.25vw,.8rem);letter-spacing:.34em;color:#9a9a9a;padding-left:.34em}
footer{margin-top:42px}.domain{font-size:clamp(.9rem,1.8vw,1.15rem);letter-spacing:.28em;padding-left:.28em}
.location{margin-top:12px;font-size:.68rem;letter-spacing:.36em;padding-left:.36em;color:#9a9a9a}
@media(max-width:600px){main{padding:6vh 0 5vh}.logo{width:min(210px,54vw);margin-bottom:46px}.subtitle{line-height:1.8;max-width:330px}.line{margin:34px 0 28px}.tagline{line-height:1.8;max-width:300px}.statement{margin-top:52px;line-height:1.8;max-width:330px}footer{margin-top:34px}}
</style>
</head>
<body>
<main>
<img class="logo" src="varveo-logo.png" alt="VARVEO">
<h1>OPENING SOON</h1>
<div class="subtitle">PREMIUM LOGISTICS &amp; DIRECT TRANSPORT</div>
<div class="line"></div>
<div class="tagline">DIRECT. RELIABLE. PROFESSIONAL.</div>
<div class="statement">A NEW STANDARD IN LOGISTICS IS COMING.</div>
<footer><div class="domain">VARVEO.DE</div><div class="location">AUGSBURG · GERMANY</div></footer>
</main>
</body>
</html>
